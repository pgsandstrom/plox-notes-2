services:
  web:
    build: .
    # node as PID 1 ignores SIGTERM, so without an init every restart waits 10s for the kill
    init: true
    ports:
      - "8088:3000"
    environment:
      - PGHOST=db
    restart: always
  db:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ploxnotes
      - POSTGRES_PASSWORD=postgres
    # "ports" are only needed if we want them exposed to the world at large:
    # ports:
    # - '5432:5432'
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/:/docker-entrypoint-initdb.d/
volumes:
  db:
